<!DOCTYPE html>
<html>
  <head>
    <title><%= productName %></title>

    <meta charset="utf-8" />
    <meta name="description" content="<%= productDescription %>" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta
      name="viewport"
      content="user-scalable=no, initial-scale=1, maximum-scale=1, minimum-scale=1, width=device-width, viewport-fit=cover"
    />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="<%= productName %>" />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="icons/apple-touch-icon-180x180.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="icons/icon-512x512.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="icons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="icons/favicon-16x16.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />

    <style>
      html,
      body {
        background-color: #ecf3f3;
        margin: 0;
        padding: 0;
        height: 100%;
      }
      body.body--dark {
        background-color: #1c2833;
      }
      #q-app {
        height: 100%;
      }
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          sans-serif;
        color: #333;
      }
      .app-loading-spinner {
        width: 40px;
        height: 40px;
        border: 3px solid #e0e0e0;
        border-top-color: #027be3;
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      .app-loading-text {
        margin-top: 16px;
        color: #666;
      }
      body.body--dark .app-loading {
        color: #fff;
      }
      body.body--dark .app-loading-spinner {
        border-color: #333;
        border-top-color: #027be3;
      }
      body.body--dark .app-loading-text {
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <!-- DO NOT touch the following DIV -->
    <div id="q-app">
      <div class="app-loading" id="app-loading">
        <div class="app-loading-spinner"></div>
        <div class="app-loading-text" id="app-loading-text">Loading...</div>
      </div>
    </div>
    <script>
      // ---------- Floating Debug Console ----------
      // Intercepts errors, promise rejections, and console methods.
      // Renders a collapsible floating panel. Works before AND after Vue mounts.
      (function () {
        // ---- Storage ----
        var logs = [];
        var MAX_LOGS = 500;
        var isIntercepting = false;
        var originalConsole = {};

        // ---- Create UI ----
        function ensureContainer() {
          var el = document.getElementById("__debug_console");
          if (el) return el;
          el = document.createElement("div");
          el.id = "__debug_console";
          el.style.cssText =
            "position:fixed;bottom:40px;right:10px;z-index:99999;font:11px/1.4 monospace;max-height:50vh;overflow:hidden;border-radius:6px;box-shadow:0 4px 20px rgba(0,0,0,0.4);display:none;flex-direction:column;min-width:260px;max-width:90vw;";
          var header = document.createElement("div");
          header.id = "__dc_header";
          header.style.cssText =
            "background:#1a1a2e;color:#fff;padding:6px 10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none;font:bold 12px/1 sans-serif;";
          header.innerHTML =
            '<span>&#x1f41b; Debug</span><span id="__dc_badge" style="background:#e94560;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;">0</span>';
          header.onclick = togglePanel;
          var body = document.createElement("div");
          body.id = "__dc_body";
          body.style.cssText =
            "background:rgba(26,26,46,0.92);color:#e0e0e0;padding:6px;overflow-y:auto;flex:1;display:none;font:11px/1.4 monospace;";
          body.ontouchstart = function (e) {
            e.stopPropagation();
          };
          var toolbar = document.createElement("div");
          toolbar.style.cssText =
            "display:flex;gap:4px;padding:4px 6px;background:rgba(26,26,46,0.95);border-top:1px solid #333;display:none;";
          toolbar.id = "__dc_toolbar";
          var clearBtn = document.createElement("button");
          clearBtn.textContent = "Clear";
          clearBtn.style.cssText =
            "background:#333;color:#ccc;border:none;border-radius:3px;padding:2px 6px;cursor:pointer;font:10px/1 sans-serif;";
          clearBtn.onclick = function () {
            logs = [];
            renderLogs();
          };
          var collapseBtn = document.createElement("button");
          collapseBtn.textContent = "Collapse";
          collapseBtn.style.cssText =
            "background:#333;color:#ccc;border:none;border-radius:3px;padding:2px 6px;cursor:pointer;font:10px/1 sans-serif;";
          collapseBtn.onclick = togglePanel;
          toolbar.appendChild(clearBtn);
          toolbar.appendChild(collapseBtn);
          body.appendChild(toolbar);
          el.appendChild(header);
          el.appendChild(body);
          document.body.appendChild(el);
          return el;
        }

        var isOpen = false;

        function togglePanel() {
          isOpen = !isOpen;
          var body = document.getElementById("__dc_body");
          var toolbar = document.getElementById("__dc_toolbar");
          var badge = document.getElementById("__dc_badge");
          if (body) body.style.display = isOpen ? "block" : "none";
          if (toolbar) toolbar.style.display = isOpen ? "flex" : "none";
          if (badge) badge.style.display = isOpen ? "none" : "inline";
          if (isOpen) renderLogs();
        }

        function addLog(type, args) {
          var text = "";
          for (var i = 0; i < args.length; i++) {
            try {
              if (typeof args[i] === "object") {
                text +=
                  (i > 0 ? " " : "") +
                  JSON.stringify(args[i], null, 2).slice(0, 500);
              } else {
                text += (i > 0 ? " " : "") + String(args[i]);
              }
            } catch (e) {
              text += (i > 0 ? " " : "") + "[unstringifiable]";
            }
          }
          logs.push({
            type: type,
            text: text,
            time: new Date().toLocaleTimeString(),
          });
          if (logs.length > MAX_LOGS) logs.shift();
          var el = document.getElementById("__debug_console");
          if (el) el.style.display = "flex";
          var badge = document.getElementById("__dc_badge");
          if (badge) badge.textContent = logs.length;
          if (isOpen) renderLogs();
        }

        function renderLogs() {
          var body = document.getElementById("__dc_body");
          if (!body) return;
          var toolbar = body.querySelector("#__dc_toolbar");
          body.innerHTML = "";
          if (toolbar) body.appendChild(toolbar.parentNode ? toolbar : toolbar);
          for (var i = Math.max(0, logs.length - 200); i < logs.length; i++) {
            var entry = logs[i];
            var div = document.createElement("div");
            div.style.cssText =
              "padding:2px 0;border-bottom:1px solid rgba(255,255,255,0.05);word-break:break-all;";
            var color =
              entry.type === "error" || entry.type === "Global"
                ? "#ff6b6b"
                : entry.type === "warn"
                ? "#ffd93d"
                : entry.type === "info"
                ? "#6bcbff"
                : "#aaa";
            div.innerHTML =
              '<span style="color:' +
              color +
              ";" +
              (entry.type === "error" || entry.type === "Global"
                ? "font-weight:bold;"
                : "") +
              '">[' +
              entry.time +
              " " +
              entry.type.toUpperCase() +
              "]</span> " +
              escapeHtml(entry.text);
            body.appendChild(div);
          }
          body.scrollTop = body.scrollHeight;
        }

        function escapeHtml(str) {
          return String(str || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;");
        }

        // ---- Intercept ----
        function startInterception() {
          if (isIntercepting) return;
          isIntercepting = true;

          // Ensure container exists
          ensureContainer();

          // Global errors
          window.addEventListener(
            "error",
            function (e) {
              var msg =
                (e.error && e.error.message) || e.message || String(e);
              if (e.filename)
                msg += " at " + e.filename + ":" + (e.lineno || 0);
              addLog("Global", [msg]);
            },
            true
          );

          // Promise rejections
          window.addEventListener(
            "unhandledrejection",
            function (e) {
              var msg =
                (e.reason && (e.reason.message || e.reason.stack || e.reason)) ||
                String(e);
              addLog("PROMISE", [msg]);
            },
            true
          );

          // Console methods
          var methods = ["log", "error", "warn", "info", "debug"];
          for (var m = 0; m < methods.length; m++) {
            var method = methods[m];
            originalConsole[method] = console[method];
            (function (mName) {
              console[mName] = function () {
                var args = Array.prototype.slice.call(arguments);
                addLog(mName === "debug" ? "DEBUG" : mName.toUpperCase(), args);
                if (originalConsole[mName]) {
                  originalConsole[mName].apply(console, args);
                }
              };
            })(method);
          }

          // Log startup
          addLog("INFO", ["Debug console active"]);

          // Show the debug button immediately
          var el = document.getElementById("__debug_console");
          if (el) el.style.display = "flex";
        }

        // ---- Init on DOM ready ----
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startInterception);
        } else {
          startInterception();
        }
      })();
    </script>
  </body>
</html>
